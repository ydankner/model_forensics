[project]
name = "oddnum"
version = "0.1.0"
description = "Why do models output an odd number when asked for an even one? A model-forensics investigation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anyio>=4.4",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.scripts]
oddnum = "oddnum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddnum"]

[tool.ruff]
line-length = 100
